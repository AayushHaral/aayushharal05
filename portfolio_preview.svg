<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480">
  <defs>
    <linearGradient id="pBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080B12"/>
      <stop offset="50%" stop-color="#101522"/>
      <stop offset="100%" stop-color="#05070B"/>
    </linearGradient>
    <linearGradient id="pAccentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <linearGradient id="pCardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#121A29" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#0E1420" stop-opacity="0.95"/>
    </linearGradient>
    <filter id="pGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="480" fill="url(#pBgGrad)"/>

  <!-- Ambient Glows -->
  <circle cx="200" cy="180" r="160" fill="#8B5CF6" opacity="0.12" filter="url(#pGlow)"/>
  <circle cx="620" cy="280" r="140" fill="#38BDF8" opacity="0.1" filter="url(#pGlow)"/>

  <!-- Browser Window Frame -->
  <rect x="40" y="35" width="720" height="410" rx="16" fill="url(#pCardGrad)" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>

  <!-- Window Header -->
  <rect x="40" y="35" width="720" height="46" rx="16" fill="#151E2E" opacity="0.8"/>
  <rect x="40" y="65" width="720" height="16" fill="#151E2E" opacity="0.8"/>
  <line x1="40" y1="81" x2="760" y2="81" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>

  <!-- Controls -->
  <circle cx="68" cy="58" r="5" fill="#EF4444" opacity="0.7"/>
  <circle cx="86" cy="58" r="5" fill="#F59E0B" opacity="0.7"/>
  <circle cx="104" cy="58" r="5" fill="#10B981" opacity="0.7"/>

  <!-- Address Bar -->
  <rect x="220" y="46" width="360" height="24" rx="6" fill="#0B0F17" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
  <circle cx="236" cy="58" r="3" fill="#10B981"/>
  <text x="248" y="62" fill="#94A3B8" font-family="'JetBrains Mono', monospace, sans-serif" font-size="11">https://aayushharal.vercel.app</text>

  <!-- Navigation Mock inside Portfolio -->
  <rect x="70" y="102" width="660" height="40" rx="10" fill="#0A0E17" opacity="0.6" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
  <text x="95" y="127" fill="#F8FAFC" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700">AH &bull; Aayush Haral</text>
  <text x="440" y="126" fill="#8B5CF6" font-family="sans-serif" font-size="11" font-weight="600">Projects</text>
  <text x="500" y="126" fill="#94A3B8" font-family="sans-serif" font-size="11">Skills</text>
  <text x="545" y="126" fill="#94A3B8" font-family="sans-serif" font-size="11">Education</text>
  <text x="615" y="126" fill="#94A3B8" font-family="sans-serif" font-size="11">Contact</text>
  <circle cx="685" cy="122" r="9" fill="#1E293B"/>

  <!-- Hero Preview Area -->
  <g transform="translate(70, 165)">
    <!-- Availability Badge -->
    <rect x="0" y="0" width="168" height="24" rx="12" fill="#10B981" fill-opacity="0.1" stroke="#10B981" stroke-opacity="0.25"/>
    <circle cx="12" cy="12" r="3.5" fill="#10B981"/>
    <text x="24" y="16" fill="#10B981" font-family="sans-serif" font-size="10" font-weight="600" letter-spacing="0.4">AVAILABLE FOR ROLES</text>

    <!-- Main Headline -->
    <text x="0" y="52" fill="#F8FAFC" font-family="'Plus Jakarta Sans', sans-serif" font-size="22" font-weight="800">Building Digital Experiences</text>
    <text x="0" y="78" fill="url(#pAccentGrad)" font-family="'Plus Jakarta Sans', sans-serif" font-size="22" font-weight="800">That Solve Real Problems.</text>
    <text x="0" y="108" fill="#94A3B8" font-family="sans-serif" font-size="12">Computer Engineering Student &bull; Aspiring Full-Stack Developer</text>

    <!-- Buttons -->
    <rect x="0" y="132" width="130" height="34" rx="8" fill="url(#pAccentGrad)"/>
    <text x="65" y="153" fill="#FFFFFF" font-family="sans-serif" font-size="11" font-weight="600" text-anchor="middle">Explore Projects &rarr;</text>

    <rect x="142" y="132" width="120" height="34" rx="8" fill="#1E293B" stroke="rgba(255,255,255,0.1)"/>
    <text x="202" y="153" fill="#F8FAFC" font-family="sans-serif" font-size="11" font-weight="500" text-anchor="middle">Download CV</text>

    <!-- Code Block / Card Representation on Right -->
    <g transform="translate(360, -5)">
      <rect x="0" y="0" width="290" height="195" rx="12" fill="#0A0E17" stroke="rgba(139,92,246,0.3)" stroke-width="1.5"/>
      <rect x="0" y="0" width="290" height="28" rx="12" fill="#121A29"/>
      <circle cx="16" cy="14" r="3.5" fill="#EF4444" opacity="0.6"/>
      <circle cx="28" cy="14" r="3.5" fill="#F59E0B" opacity="0.6"/>
      <circle cx="40" cy="14" r="3.5" fill="#10B981" opacity="0.6"/>
      <text x="56" y="18" fill="#64748B" font-family="'JetBrains Mono', monospace" font-size="10">developer.config.ts</text>

      <!-- Code lines -->
      <text x="18" y="52" fill="#8B5CF6" font-family="'JetBrains Mono', monospace" font-size="11">const</text>
      <text x="56" y="52" fill="#38BDF8" font-family="'JetBrains Mono', monospace" font-size="11">developer</text>
      <text x="122" y="52" fill="#F8FAFC" font-family="'JetBrains Mono', monospace" font-size="11">= {</text>
      
      <text x="32" y="74" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="11">name:</text>
      <text x="74" y="74" fill="#34D399" font-family="'JetBrains Mono', monospace" font-size="11">"Aayush Haral"</text>
      <text x="175" y="74" fill="#64748B" font-family="'JetBrains Mono', monospace" font-size="11">,</text>

      <text x="32" y="96" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="11">role:</text>
      <text x="74" y="96" fill="#34D399" font-family="'JetBrains Mono', monospace" font-size="11">"Full-Stack Dev"</text>
      <text x="195" y="96" fill="#64748B" font-family="'JetBrains Mono', monospace" font-size="11">,</text>

      <text x="32" y="118" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="11">degree:</text>
      <text x="86" y="118" fill="#34D399" font-family="'JetBrains Mono', monospace" font-size="11">"B.E. Computer"</text>
      <text x="195" y="118" fill="#64748B" font-family="'JetBrains Mono', monospace" font-size="11">,</text>

      <text x="32" y="140" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="11">stack:</text>
      <text x="78" y="140" fill="#F8FAFC" font-family="'JetBrains Mono', monospace" font-size="11">["React", "PHP", "MySQL"]</text>

      <text x="18" y="162" fill="#F8FAFC" font-family="'JetBrains Mono', monospace" font-size="11">};</text>

      <rect x="18" y="174" width="254" height="1" fill="rgba(255,255,255,0.06)"/>
      <text x="18" y="186" fill="#10B981" font-family="'JetBrains Mono', monospace" font-size="9">&gt; Production Ready &bull; Vercel Deployed</text>
    </g>
  </g>
</svg>

