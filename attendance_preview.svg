<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.9"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="480" fill="url(#bgGrad)"/>
  
  <!-- Subtle Grid Lines -->
  <g stroke="rgba(255,255,255,0.03)" stroke-width="1">
    <line x1="0" y1="80" x2="800" y2="80"/>
    <line x1="0" y1="160" x2="800" y2="160"/>
    <line x1="0" y1="240" x2="800" y2="240"/>
    <line x1="0" y1="320" x2="800" y2="320"/>
    <line x1="0" y1="400" x2="800" y2="400"/>
    <line x1="160" y1="0" x2="160" y2="480"/>
    <line x1="320" y1="0" x2="320" y2="480"/>
    <line x1="480" y1="0" x2="480" y2="480"/>
    <line x1="640" y1="0" x2="640" y2="480"/>
  </g>

  <!-- Ambient Glow Behind App -->
  <circle cx="400" cy="200" r="180" fill="#38BDF8" opacity="0.08" filter="url(#glow)"/>

  <!-- App Window Container -->
  <rect x="40" y="35" width="720" height="410" rx="16" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.1)" stroke-width="1.5"/>

  <!-- Window Header Bar -->
  <rect x="40" y="35" width="720" height="48" rx="16" fill="#1E293B" opacity="0.6"/>
  <rect x="40" y="67" width="720" height="16" fill="#1E293B" opacity="0.6"/>
  
  <!-- Traffic Light Window Controls -->
  <circle cx="68" cy="59" r="6" fill="#EF4444" opacity="0.8"/>
  <circle cx="88" cy="59" r="6" fill="#F59E0B" opacity="0.8"/>
  <circle cx="108" cy="59" r="6" fill="#10B981" opacity="0.8"/>
  
  <!-- App Title / Path -->
  <text x="400" y="64" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" text-anchor="middle" letter-spacing="0.5">
    Smart Attendance Management System &bull; Admin Portal (PHP &amp; MySQL)
  </text>

  <!-- Left Sidebar Mock -->
  <rect x="40" y="83" width="160" height="362" fill="#0F172A" opacity="0.5"/>
  <line x1="200" y1="83" x2="200" y2="445" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  
  <!-- Sidebar Menu Items -->
  <rect x="56" y="105" width="128" height="28" rx="6" fill="#38BDF8" opacity="0.15"/>
  <text x="88" y="123" fill="#38BDF8" font-family="sans-serif" font-size="11" font-weight="600">Dashboard</text>
  <circle cx="72" cy="119" r="4" fill="#38BDF8"/>

  <text x="88" y="157" fill="#64748B" font-family="sans-serif" font-size="11">Student Roster</text>
  <circle cx="72" cy="153" r="4" fill="#64748B"/>

  <text x="88" y="191" fill="#64748B" font-family="sans-serif" font-size="11">Daily Check-in</text>
  <circle cx="72" cy="187" r="4" fill="#64748B"/>

  <text x="88" y="225" fill="#64748B" font-family="sans-serif" font-size="11">Attendance Reports</text>
  <circle cx="72" cy="221" r="4" fill="#64748B"/>

  <text x="88" y="259" fill="#64748B" font-family="sans-serif" font-size="11">System Settings</text>
  <circle cx="72" cy="255" r="4" fill="#64748B"/>

  <!-- Main Dashboard Content Area -->
  <!-- Stat Cards Row -->
  <g transform="translate(220, 105)">
    <!-- Stat Card 1 -->
    <rect x="0" y="0" width="155" height="70" rx="10" fill="#1E293B" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
    <text x="14" y="24" fill="#94A3B8" font-family="sans-serif" font-size="10" font-weight="500">TOTAL STUDENTS</text>
    <text x="14" y="52" fill="#F8FAFC" font-family="sans-serif" font-size="22" font-weight="700">1,248</text>
    <rect x="105" y="14" width="38" height="18" rx="4" fill="#10B981" opacity="0.15"/>
    <text x="124" y="27" fill="#10B981" font-family="sans-serif" font-size="10" font-weight="600" text-anchor="middle">+12%</text>

    <!-- Stat Card 2 -->
    <rect x="175" y="0" width="155" height="70" rx="10" fill="#1E293B" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
    <text x="189" y="24" fill="#94A3B8" font-family="sans-serif" font-size="10" font-weight="500">TODAY'S ATTENDANCE</text>
    <text x="189" y="52" fill="#38BDF8" font-family="sans-serif" font-size="22" font-weight="700">96.4%</text>
    <rect x="280" y="14" width="38" height="18" rx="4" fill="#38BDF8" opacity="0.15"/>
    <text x="299" y="27" fill="#38BDF8" font-family="sans-serif" font-size="10" font-weight="600" text-anchor="middle">Live</text>

    <!-- Stat Card 3 -->
    <rect x="350" y="0" width="160" height="70" rx="10" fill="#1E293B" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
    <text x="364" y="24" fill="#94A3B8" font-family="sans-serif" font-size="10" font-weight="500">ABSENT / ON LEAVE</text>
    <text x="364" y="52" fill="#F43F5E" font-family="sans-serif" font-size="22" font-weight="700">45</text>
    <rect x="455" y="14" width="45" height="18" rx="4" fill="#F43F5E" opacity="0.15"/>
    <text x="477" y="27" fill="#F43F5E" font-family="sans-serif" font-size="10" font-weight="600" text-anchor="middle">Review</text>
  </g>

  <!-- Attendance Table Section -->
  <g transform="translate(220, 195)">
    <rect x="0" y="0" width="510" height="225" rx="10" fill="#1E293B" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
    
    <!-- Table Header -->
    <rect x="0" y="0" width="510" height="34" rx="10" fill="#0F172A" opacity="0.6"/>
    <text x="18" y="22" fill="#94A3B8" font-family="sans-serif" font-size="11" font-weight="600">STUDENT NAME</text>
    <text x="160" y="22" fill="#94A3B8" font-family="sans-serif" font-size="11" font-weight="600">ROLL NO</text>
    <text x="260" y="22" fill="#94A3B8" font-family="sans-serif" font-size="11" font-weight="600">TIMESTAMP</text>
    <text x="380" y="22" fill="#94A3B8" font-family="sans-serif" font-size="11" font-weight="600">STATUS</text>

    <!-- Row 1 -->
    <line x1="0" y1="35" x2="510" y2="35" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
    <circle cx="28" cy="55" r="10" fill="#38BDF8" opacity="0.2"/>
    <text x="28" y="59" fill="#38BDF8" font-family="sans-serif" font-size="10" font-weight="700" text-anchor="middle">AH</text>
    <text x="48" y="59" fill="#F8FAFC" font-family="sans-serif" font-size="12" font-weight="500">Aayush Haral</text>
    <text x="160" y="59" fill="#94A3B8" font-family="sans-serif" font-size="11">BE-COMP-42</text>
    <text x="260" y="59" fill="#94A3B8" font-family="sans-serif" font-size="11">09:14 AM</text>
    <rect x="380" y="47" width="60" height="20" rx="4" fill="#10B981" opacity="0.15"/>
    <text x="410" y="61" fill="#10B981" font-family="sans-serif" font-size="10" font-weight="600" text-anchor="middle">Present</text>

    <!-- Row 2 -->
    <line x1="0" y1="75" x2="510" y2="75" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
    <circle cx="28" cy="95" r="10" fill="#818CF8" opacity="0.2"/>
    <text x="28" y="99" fill="#818CF8" font-family="sans-serif" font-size="10" font-weight="700" text-anchor="middle">RS</text>
    <text x="48" y="99" fill="#F8FAFC" font-family="sans-serif" font-size="12" font-weight="500">Rahul Sharma</text>
    <text x="160" y="99" fill="#94A3B8" font-family="sans-serif" font-size="11">BE-COMP-18</text>
    <text x="260" y="99" fill="#94A3B8" font-family="sans-serif" font-size="11">09:18 AM</text>
    <rect x="380" y="87" width="60" height="20" rx="4" fill="#10B981" opacity="0.15"/>
    <text x="410" y="101" fill="#10B981" font-family="sans-serif" font-size="10" font-weight="600" text-anchor="middle">Present</text>

    <!-- Row 3 -->
    <line x1="0" y1="115" x2="510" y2="115" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
    <circle cx="28" cy="135" r="10" fill="#F59E0B" opacity="0.2"/>
    <text x="28" y="139" fill="#F59E0B" font-family="sans-serif" font-size="10" font-weight="700" text-anchor="middle">PP</text>
    <text x="48" y="139" fill="#F8FAFC" font-family="sans-serif" font-size="12" font-weight="500">Pooja Patil</text>
    <text x="160" y="139" fill="#94A3B8" font-family="sans-serif" font-size="11">BE-COMP-29</text>
    <text x="260" y="139" fill="#94A3B8" font-family="sans-serif" font-size="11">09:32 AM</text>
    <rect x="380" y="127" width="60" height="20" rx="4" fill="#F59E0B" opacity="0.15"/>
    <text x="410" y="141" fill="#F59E0B" font-family="sans-serif" font-size="10" font-weight="600" text-anchor="middle">Late</text>

    <!-- Row 4 -->
    <line x1="0" y1="155" x2="510" y2="155" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
    <circle cx="28" cy="175" r="10" fill="#38BDF8" opacity="0.2"/>
    <text x="28" y="179" fill="#38BDF8" font-family="sans-serif" font-size="10" font-weight="700" text-anchor="middle">SK</text>
    <text x="48" y="179" fill="#F8FAFC" font-family="sans-serif" font-size="12" font-weight="500">Siddharth Kulkarni</text>
    <text x="160" y="179" fill="#94A3B8" font-family="sans-serif" font-size="11">BE-COMP-34</text>
    <text x="260" y="179" fill="#94A3B8" font-family="sans-serif" font-size="11">09:12 AM</text>
    <rect x="380" y="167" width="60" height="20" rx="4" fill="#10B981" opacity="0.15"/>
    <text x="410" y="181" fill="#10B981" font-family="sans-serif" font-size="10" font-weight="600" text-anchor="middle">Present</text>

    <!-- Bottom summary row -->
    <line x1="0" y1="195" x2="510" y2="195" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
    <text x="18" y="212" fill="#64748B" font-family="sans-serif" font-size="11">Displaying 4 of 65 records &bull; MySQL Relational Store</text>
  </g>
</svg>
