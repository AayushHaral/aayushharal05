<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="900" height="600">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="certBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080B12"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#05070B"/>
    </linearGradient>

    <!-- Accent Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="50%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>

    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="600" fill="url(#certBg)"/>

  <!-- Ambient Light Circles -->
  <circle cx="150" cy="150" r="140" fill="#8B5CF6" opacity="0.08" filter="url(#softGlow)"/>
  <circle cx="750" cy="450" r="160" fill="#38BDF8" opacity="0.08" filter="url(#softGlow)"/>

  <!-- Outer Double Borders -->
  <rect x="30" y="30" width="840" height="540" rx="16" fill="none" stroke="url(#borderGrad)" stroke-width="2" opacity="0.65"/>
  <rect x="42" y="42" width="816" height="516" rx="12" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>

  <!-- Decorative Corner Brackets -->
  <g stroke="url(#borderGrad)" stroke-width="3" fill="none">
    <path d="M 55 85 L 55 55 L 85 55"/>
    <path d="M 845 85 L 845 55 L 815 55"/>
    <path d="M 55 515 L 55 545 L 85 545"/>
    <path d="M 845 515 L 845 545 L 815 545"/>
  </g>

  <!-- Top Badge / Header -->
  <rect x="350" y="65" width="200" height="30" rx="15" fill="rgba(139,92,246,0.15)" stroke="rgba(139,92,246,0.3)" stroke-width="1"/>
  <text x="450" y="85" fill="#C4B5FD" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" letter-spacing="1.5" text-anchor="middle">TECHNICAL WORKSHOP &bull; 2026</text>

  <!-- Certificate Heading -->
  <text x="450" y="145" fill="#94A3B8" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="600" letter-spacing="3" text-anchor="middle">CERTIFICATE OF PARTICIPATION</text>
  <text x="450" y="200" fill="#F8FAFC" font-family="'Plus Jakarta Sans', sans-serif" font-size="34" font-weight="800" letter-spacing="-0.5" text-anchor="middle">Agentic AI Workshop</text>

  <!-- Separator Line -->
  <line x1="330" y1="225" x2="570" y2="225" stroke="url(#borderGrad)" stroke-width="2" opacity="0.8"/>

  <!-- Presentation Statement -->
  <text x="450" y="270" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="14" text-anchor="middle">This is to acknowledge the participation of</text>
  
  <!-- Candidate Name -->
  <text x="450" y="320" fill="url(#borderGrad)" font-family="'Plus Jakarta Sans', sans-serif" font-size="28" font-weight="800" text-anchor="middle">Aayush Anil Haral</text>

  <!-- Description Body -->
  <text x="450" y="365" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="13.5" text-anchor="middle">
    For participating in the specialized workshop on Agentic AI concepts, autonomous AI workflows,
  </text>
  <text x="450" y="390" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="13.5" text-anchor="middle">
    and AI-driven intelligent software systems.
  </text>

  <!-- Organizer & Details Box -->
  <g transform="translate(140, 440)">
    <!-- Box 1: Organizer -->
    <rect x="0" y="0" width="280" height="70" rx="10" fill="#121A29" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    <text x="20" y="28" fill="#64748B" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600" letter-spacing="1">ORGANIZER</text>
    <text x="20" y="52" fill="#F8FAFC" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700">YSM Solutions Pvt. Ltd.</text>

    <!-- Center Seal Mock -->
    <g transform="translate(310, 0)">
      <circle cx="35" cy="35" r="30" fill="rgba(245, 158, 11, 0.1)" stroke="url(#goldGrad)" stroke-width="1.5"/>
      <circle cx="35" cy="35" r="22" fill="none" stroke="url(#goldGrad)" stroke-width="1" stroke-dasharray="3 3"/>
      <polygon points="35,18 39,28 49,29 42,36 44,46 35,41 26,46 28,36 21,29 31,28" fill="url(#goldGrad)"/>
    </g>

    <!-- Box 2: Verification Details -->
    <rect x="380" y="0" width="240" height="70" rx="10" fill="#121A29" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    <text x="400" y="28" fill="#64748B" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600" letter-spacing="1">EVENT YEAR &amp; STATUS</text>
    <text x="400" y="52" fill="#38BDF8" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700">2026 &bull; Verified Participation</text>
  </g>

  <!-- Bottom Verification Notice -->
  <text x="450" y="545" fill="#64748B" font-family="'JetBrains Mono', monospace" font-size="10.5" text-anchor="middle">
    Preview Document &bull; Official Certificate Upload / Replacement Ready
  </text>
</svg>
